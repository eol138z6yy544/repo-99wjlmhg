[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mk-telegram-app"
version = "0.1.0"
description = "Telegram Web App for playing Sega Genesis ROMs via Nostalgist.js"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-telegram-bot>=20.0",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["roms*"]
