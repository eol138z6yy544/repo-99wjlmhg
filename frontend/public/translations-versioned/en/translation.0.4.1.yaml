faq:
    pageTitle: FAQ
    items:
        - title: How does Stars Birds work?
          text: "You buy birds that lay eggs. The eggs accumulate in real time. Then you sell them and receive two currencies: Silver for purchases and Gold for withdrawal."
        - title: How can I earn here?
          text: When you first log in, you’ll receive a starter bird and some Silver. To earn faster, buy more birds or upgrade your warehouse.
        - title: What should I do with the eggs?
          text: Eggs are the main resource produced by your birds. You can sell them to earn rewards.
        - title: How do I sell eggs?
          text: Go to the “Warehouse” section and click “SELL”. When you sell eggs, you receive Silver and Gold.
        - title: What is Silver used for?
          text: "Silver is used for in-game purchases: birds and warehouse upgrades."
        - title: What is Gold used for?
          text: Gold is the withdrawal currency. You can exchange it for real money. Withdrawals are automatic and almost instant.
        - title: What happens if the warehouse is full?
          text: Egg production stops when your warehouse is full! Upgrade your warehouse or sell eggs regularly to avoid losing profit.
        - title: What types of birds are there?
          text: There are 5 bird levels, each with its own productivity.
        - title: What is the warehouse?
          text: The warehouse is where your eggs are stored. Upgrading it increases its capacity.
        - title: Can I use Gold for purchases?
          text: "Yes, but with one step: first exchange Gold for Silver in the “EXCHANGE” section. Afterwards, you can use the Silver for any in-game purchases.  Plus, you’ll receive a +10% bonus!"
        - title: Can I get birds for free?
          text: Yes! Complete tasks, earn bonuses, join contests and invite friends.
        - title: How does the referral system work?
          text: "For each invited player you receive: For each invited player you receive: • up to 3200 Silver • and up to 12% of all their top-ups. Your referral link is available in the “Earn” section. You can find detailed information on the “Referral System” page."
        - title: Where can I get help?
          text: If you have any issues, go to the “Support” section — we’re always here to help.
    contactBtn: Contact Support
