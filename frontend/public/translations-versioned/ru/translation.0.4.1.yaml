faq:
    pageTitle: Часто задаваемые вопросы
    items:
        - title: Как работает Stars Birds?
          text: "Вы покупаете птиц, которые несут яйца. Яйца накапливаются в реальном времени. Потом вы продаёте их и получаете две валюты: серебро для покупок и золото для вывода."
        - title: Как здесь зарабатывать?
          text: При первом входе вы получите стартовую птицу и немного серебра. Чтобы зарабатывать быстрее, купите новых птиц или улучшите склад.
        - title: Что делать с яйцами?
          text: Яйца — это основной ресурс производимый птицами, который вы можете продать чтобы заработать.
        - title: Как продать яйца?
          text: Перейдите в раздел «Склад» и нажмите «ПРОДАТЬ». При продаже яиц вы получаете серебро и золото.
        - title: Для чего нужно серебро?
          text: "Серебро используется для покупок внутри игры: птицы и апгрейды склада."
        - title: Для чего нужно золото?
          text: Золото — это валюта для вывода. Именно его вы можете обменять на реальные деньги. Вывод осуществляется автоматически и почти мгновенно.
        - title: Что произойдёт, если склад переполнится?
          text: Яйца перестанут накапливаться! Улучшите склад или регулярно собирайте яйца и продавайте их, чтобы не терять прибыль.
        - title: Какие бывают птицы?
          text: У нас 5 уровней птиц, у каждой своя продуктивность.
        - title: Что такое склад?
          text: Склад — это лимит на количество яиц, которые можно накопить. Улучшение склада увеличивает вместимость.
        - title: Могу ли я использовать золото для покупок?
          text: "Да, но с небольшим шагом: сначала обменяйте золото на серебро в разделе «ОБМЕННИК». После обмена вы сможете использовать полученное серебро для любых внутриигровых покупок. К тому же вы получите +10% бонуса!"
        - title: Можно ли получить птиц бесплатно?
          text: Да! Выполняйте задания, получайте бонусы, участвуйте в конкурсах и приглашайте друзей.
        - title: Как работает реферальная система?
          text: >-
              За каждого приглашённого игрока вы получаете: • до 3200 серебра • и до 12% от всех его пополнений. Ваша реферальная ссылка доступна в разделе «Заработок». Подробная информация находится на странице «Реферальная система».
        - title: Где получить помощь?
          text: Если возникли сложности — напишите в раздел «Поддержка», мы всегда на связи.
    contactBtn: «Поддержка»
